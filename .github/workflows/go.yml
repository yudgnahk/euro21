name: Go CI

on:
  push:
    branches:
      - master
      - develop
      - fix/*
  pull_request:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-go@v2
        with:
          go-version: '1.23' # Updated from 1.16
      - name: Build
        run: go build -v .
